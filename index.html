<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nido S-Mart Living</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            font-family: 'Arial', sans-serif;
            background: #0a0f1c;
        }
        .hero {
            min-height: 100vh;
            background: linear-gradient(rgba(10,15,28,0.65), rgba(10,15,28,0.75)), 
                        url('NidoLogo.jpeg') center/contain no-repeat;
            background-color: #0a0f1c;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .btn {
            padding: 18px 55px;
            font-size: 1.5rem;
            background: #22d3ee;
            color: #0a0f1c;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(34, 211, 238, 0.3);
        }
        .btn:hover {
            background: #67e8f9;
            transform: scale(1.08);
        }
    </style>
</head>
<body>
    <div class="hero">
        <button class="btn">Nuestras Soluciones</button>
    </div>
</body>
</html>
