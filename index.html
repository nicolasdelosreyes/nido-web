<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nido S-Mart Living | Hogar Inteligente</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            font-family: 'Arial', sans-serif;
            color: white;
            background: #0a0f1c;
        }
        .hero {
            min-height: 100vh;
            background: linear-gradient(rgba(10,15,28,0.7), rgba(10,15,28,0.8)), 
                        url('NidoLogo.jpeg') center/contain no-repeat;
            background-color: #0a0f1c;           /* fondo oscuro por si sobra espacio */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .content {
            max-width: 900px;
            z-index: 2;
        }
        h1 {
            font-size: 5rem;
            margin-bottom: 15px;
            text-shadow: 0 5px 25px rgba(0,0,0,0.9);
        }
        .subtitle {
            font-size: 2rem;
            color: #67e8f9;
            margin-bottom: 25px;
        }
        .description {
            font-size: 1.4rem;
            margin-bottom: 50px;
        }
        .btn {
            padding: 16px 45px;
            font-size: 1.3rem;
            background: #22d3ee;
            color: #0a0f1c;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover {
            background: #67e8f9;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="content">
            <h1>NIDO</h1>
            <p class="subtitle">S-MART LIVING</p>
            <p class="description">Tu hogar, inteligentemente protegido</p>
            <button class="btn">Conocer Nuestras Soluciones</button>
        </div>
    </div>
</body>
</html>
